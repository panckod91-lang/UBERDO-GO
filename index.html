<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Remisímetro GPS</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Remisímetro" />
  <style>
    :root{
      --bg:#07111f;
      --panel:#101d31;
      --panel2:#0b1728;
      --text:#f6fbff;
      --muted:#93a4b8;
      --green:#28e39c;
      --cyan:#5bd7ff;
      --yellow:#ffd166;
      --red:#ff5d73;
      --border:rgba(255,255,255,.10);
      --shadow:0 18px 60px rgba(0,0,0,.36);
      --radius:24px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}
    body{
      min-height:100svh;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(91,215,255,.18), transparent 36%),
        radial-gradient(circle at 80% 10%, rgba(40,227,156,.12), transparent 34%),
        linear-gradient(145deg,#06101f,#0a1424 45%,#050a12);
    }
    button,input{font:inherit}
    .app{
      width:100vw;
      height:100svh;
      padding:14px;
      display:grid;
      grid-template-columns: 1.25fr .75fr;
      gap:14px;
    }
    .left,.right{
      min-width:0;
      min-height:0;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:rgba(16,29,49,.78);
      box-shadow:var(--shadow);
      backdrop-filter: blur(14px);
      overflow:hidden;
    }
    .left{display:flex;flex-direction:column}
    .right{display:flex;flex-direction:column;padding:14px;gap:12px}
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px 8px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:44px;height:44px;border-radius:16px;
      background:linear-gradient(135deg,var(--cyan),var(--green));
      display:grid;place-items:center;color:#03101a;font-weight:1000;font-size:22px;
      box-shadow:0 12px 35px rgba(40,227,156,.20);
      flex:0 0 auto;
    }
    h1{font-size:21px;line-height:1.1;margin:0}
    .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{
      display:flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);
      border:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap;
    }
    .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px var(--yellow)}
    .dot.ok{background:var(--green);box-shadow:0 0 14px var(--green)}
    .dot.bad{background:var(--red);box-shadow:0 0 14px var(--red)}
    .meter{
      flex:1;
      display:grid;
      grid-template-rows:auto 1fr auto;
      padding:0 16px 16px;
      gap:12px;
      min-height:0;
    }
    .fareBox{
      border-radius:28px;
      background:linear-gradient(180deg,rgba(4,12,22,.72),rgba(5,10,18,.92));
      border:1px solid rgba(255,255,255,.10);
      padding:18px;
      min-height:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .fareBox:before{
      content:"";
      position:absolute;inset:-90px;
      background:radial-gradient(circle,rgba(40,227,156,.10),transparent 46%);
      animation:pulse 3s ease-in-out infinite;
    }
    @keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
    .label{text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);font-size:12px;position:relative;z-index:1}
    .fare{
      font-variant-numeric:tabular-nums;
      font-size:clamp(58px,11vw,124px);
      line-height:.95;
      font-weight:1000;
      color:var(--green);
      text-shadow:0 0 30px rgba(40,227,156,.25);
      position:relative;z-index:1;
      white-space:nowrap;
    }
    .state{
      display:inline-flex;align-items:center;gap:8px;margin-top:8px;
      color:var(--muted);font-weight:700;position:relative;z-index:1
    }
    .gridStats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .stat{
      background:rgba(255,255,255,.055);
      border:1px solid var(--border);
      border-radius:20px;
      padding:13px;
      min-width:0;
    }
    .stat b{
      display:block;
      font-size:clamp(20px,3.1vw,35px);
      line-height:1.1;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .controls{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }
    .btn{
      border:0;border-radius:20px;padding:15px 10px;
      color:#05101b;font-weight:1000;cursor:pointer;
      background:#e9f2ff;
      box-shadow:0 12px 24px rgba(0,0,0,.20);
    }
    .btn:active{transform:translateY(1px);filter:brightness(.94)}
    .start{background:linear-gradient(135deg,#23e094,#64ffd0)}
    .pause{background:linear-gradient(135deg,#ffd166,#fff0aa)}
    .finish{background:linear-gradient(135deg,#5bd7ff,#a9efff)}
    .danger{background:linear-gradient(135deg,#ff5d73,#ff9aaa);color:#22040a}
    .sectionTitle{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin:2px 0 0;
    }
    .sectionTitle h2{font-size:15px;margin:0}
    .pill{
      font-size:11px;color:var(--muted);border:1px solid var(--border);
      padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.045)
    }
    .panel{
      background:rgba(255,255,255,.055);
      border:1px solid var(--border);
      border-radius:20px;
      padding:12px;
    }
    .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
    input{
      width:100%;margin-top:5px;border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);color:var(--text);
      border-radius:14px;padding:11px 12px;outline:none;
    }
    input:focus{border-color:rgba(91,215,255,.6);box-shadow:0 0 0 3px rgba(91,215,255,.10)}
    .destRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
    .miniBtn{
      border:1px solid var(--border);border-radius:14px;padding:10px 12px;
      background:rgba(255,255,255,.09);color:var(--text);font-weight:900;cursor:pointer;
    }
    .history{
      flex:1;min-height:0;overflow:auto;padding-right:4px;
      display:flex;flex-direction:column;gap:8px;
    }
    .trip{
      border:1px solid var(--border);
      border-radius:16px;padding:10px;
      background:rgba(0,0,0,.15);
      display:grid;grid-template-columns:1fr auto;gap:8px;
    }
    .trip strong{font-size:15px}
    .trip small{display:block;color:var(--muted);margin-top:3px}
    .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px}
    .tips{font-size:12px;color:var(--muted);line-height:1.35}
    @media (orientation:portrait){
      body:before{
        content:"Giralo horizontal ↔";
        position:fixed;inset:0;display:grid;place-items:center;
        background:#07111f;color:white;font-size:28px;font-weight:1000;z-index:99;
      }
    }
    @media (max-width: 820px){
      .app{grid-template-columns:1fr .86fr;padding:8px;gap:8px}
      header{padding:10px 10px 4px}
      .logo{width:38px;height:38px;border-radius:13px}
      h1{font-size:17px}
      .fareBox{padding:12px;border-radius:22px}
      .gridStats{gap:7px}
      .stat{padding:9px;border-radius:16px}
      .controls{gap:7px}
      .btn{padding:12px 6px;border-radius:16px;font-size:13px}
      .right{padding:8px;gap:8px}
      .panel{padding:9px;border-radius:16px}
      input{padding:8px}
      .history{gap:6px}
      .trip{padding:8px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="left">
      <header>
        <div class="brand">
          <div class="logo">R</div>
          <div>
            <h1>Remisímetro GPS</h1>
            <div class="sub" id="subtitle">Listo para iniciar viaje</div>
          </div>
        </div>
        <div class="status"><span class="dot" id="gpsDot"></span><span id="gpsStatus">GPS pendiente</span></div>
      </header>

      <div class="meter">
        <div class="fareBox">
          <div class="label">Total estimado</div>
          <div class="fare" id="total">$0</div>
          <div class="state" id="rideState">● Libre</div>
        </div>

        <div class="gridStats">
          <div class="stat"><div class="label">Km</div><b id="km">0.000</b></div>
          <div class="stat"><div class="label">Tiempo</div><b id="time">00:00</b></div>
          <div class="stat"><div class="label">Velocidad</div><b id="speed">0</b></div>
          <div class="stat"><div class="label">Precisión</div><b id="accuracy">—</b></div>
        </div>

        <div class="controls">
          <button class="btn start" id="startBtn">Iniciar</button>
          <button class="btn pause" id="pauseBtn">Pausar</button>
          <button class="btn finish" id="finishBtn">Finalizar</button>
          <button class="btn danger" id="resetBtn">Reset</button>
        </div>
      </div>
    </section>

    <aside class="right">
      <div class="sectionTitle">
        <h2>Destino / Navegación</h2>
        <span class="pill">Maps externo</span>
      </div>
      <div class="panel">
        <label>Dirección destino</label>
        <input id="destination" placeholder="Ej: San Martín 500, Rosario" autocomplete="street-address" />
        <div class="destRow">
          <button class="miniBtn" id="mapsBtn">Abrir Google Maps</button>
          <button class="miniBtn" id="wazeBtn">Waze</button>
        </div>
        <div class="tips" style="margin-top:9px">
          Tip: iniciá el viaje acá y después abrí Maps. Al volver, el conteo sigue si Android no durmió la app.
        </div>
      </div>

      <div class="sectionTitle">
        <h2>Tarifa</h2>
        <button class="miniBtn" id="saveFareBtn">Guardar</button>
      </div>
      <div class="panel">
        <div class="formGrid">
          <div><label>Bajada</label><input id="baseFare" type="number" inputmode="decimal"></div>
          <div><label>$/km</label><input id="kmFare" type="number" inputmode="decimal"></div>
          <div><label>$/min</label><input id="minFare" type="number" inputmode="decimal"></div>
          <div><label>Mínimo</label><input id="minTotal" type="number" inputmode="decimal"></div>
        </div>
      </div>

      <div class="sectionTitle">
        <h2>Historial</h2>
        <button class="miniBtn" id="clearHistoryBtn">Limpiar</button>
      </div>
      <div class="history" id="history"></div>
    </aside>
  </main>

<script>
const VERSION = "1.0.0";
const CACHE_LABEL = "remisimetro-gps";

let watchId = null;
let isRunning = false;
let isPaused = false;
let startedAt = null;
let elapsedSeconds = 0;
let timer = null;
let lastPoint = null;
let distanceMeters = 0;
let currentSpeed = 0;
let currentAccuracy = null;

const $ = (id) => document.getElementById(id);
const money = (n) => "$" + Math.round(n || 0).toLocaleString("es-AR");

const defaultFare = {
  baseFare: 1500,
  kmFare: 850,
  minFare: 120,
  minTotal: 1500
};

let fare = loadFare();

function loadFare(){
  try { return {...defaultFare, ...JSON.parse(localStorage.getItem("fareConfig") || "{}")}; }
  catch(e){ return {...defaultFare}; }
}

function saveFare(){
  fare = {
    baseFare: parseFloat($("baseFare").value) || 0,
    kmFare: parseFloat($("kmFare").value) || 0,
    minFare: parseFloat($("minFare").value) || 0,
    minTotal: parseFloat($("minTotal").value) || 0
  };
  localStorage.setItem("fareConfig", JSON.stringify(fare));
  updateUI();
  toast("Tarifa guardada");
}

function paintFare(){
  $("baseFare").value = fare.baseFare;
  $("kmFare").value = fare.kmFare;
  $("minFare").value = fare.minFare;
  $("minTotal").value = fare.minTotal;
}

function calcTotal(){
  const km = distanceMeters / 1000;
  const minutes = elapsedSeconds / 60;
  const raw = fare.baseFare + (km * fare.kmFare) + (minutes * fare.minFare);
  return Math.max(raw, fare.minTotal || 0);
}

function formatTime(s){
  const mm = Math.floor(s/60);
  const ss = s % 60;
  return String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
}

function setGpsStatus(text, mode){
  $("gpsStatus").textContent = text;
  $("gpsDot").className = "dot " + (mode || "");
}

function updateUI(){
  $("total").textContent = money(calcTotal());
  $("km").textContent = (distanceMeters/1000).toFixed(3);
  $("time").textContent = formatTime(elapsedSeconds);
  $("speed").textContent = Math.round(currentSpeed || 0);
  $("accuracy").textContent = currentAccuracy ? Math.round(currentAccuracy) + "m" : "—";

  if(!isRunning){
    $("rideState").textContent = "● Libre";
    $("subtitle").textContent = "Listo para iniciar viaje";
  } else if(isPaused){
    $("rideState").textContent = "● Pausado";
    $("subtitle").textContent = "Viaje pausado";
  } else {
    $("rideState").textContent = "● En viaje";
    $("subtitle").textContent = "Midiendo con GPS";
  }
}

function startRide(){
  if(isRunning && isPaused){
    isPaused = false;
    startTimer();
    updateUI();
    return;
  }
  if(isRunning) return;

  if(!("geolocation" in navigator)){
    setGpsStatus("GPS no disponible", "bad");
    alert("Este navegador no soporta geolocalización.");
    return;
  }

  isRunning = true;
  isPaused = false;
  startedAt = new Date();
  elapsedSeconds = 0;
  distanceMeters = 0;
  lastPoint = null;
  currentSpeed = 0;
  currentAccuracy = null;

  setGpsStatus("Pidiendo GPS...", "");
  startTimer();

  watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 12000
  });

  updateUI();
}

function startTimer(){
  clearInterval(timer);
  timer = setInterval(() => {
    if(isRunning && !isPaused){
      elapsedSeconds++;
      updateUI();
    }
  }, 1000);
}

function pauseRide(){
  if(!isRunning) return;
  isPaused = !isPaused;
  updateUI();
}

function finishRide(){
  if(!isRunning) return;
  isPaused = true;
  clearInterval(timer);
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);

  const trip = {
    date: new Date().toISOString(),
    seconds: elapsedSeconds,
    meters: distanceMeters,
    total: calcTotal(),
    destination: $("destination").value.trim()
  };
  saveTrip(trip);
  resetRide(false);
  renderHistory();
  toast("Viaje guardado");
}

function resetRide(confirmAsk = true){
  if(confirmAsk && isRunning && !confirm("¿Resetear el viaje actual?")) return;
  clearInterval(timer);
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  isRunning = false;
  isPaused = false;
  startedAt = null;
  elapsedSeconds = 0;
  distanceMeters = 0;
  lastPoint = null;
  currentSpeed = 0;
  currentAccuracy = null;
  updateUI();
}

function onPosition(pos){
  const c = pos.coords;
  currentAccuracy = c.accuracy || null;
  currentSpeed = typeof c.speed === "number" && c.speed !== null ? c.speed * 3.6 : currentSpeed;

  setGpsStatus("GPS OK", "ok");

  if(isPaused) return;

  const point = {
    lat: c.latitude,
    lon: c.longitude,
    accuracy: c.accuracy || 9999,
    time: pos.timestamp
  };

  // Filtro simple anti-saltos: ignora precisión muy mala y saltos absurdos.
  if(point.accuracy > 80){
    updateUI();
    return;
  }

  if(lastPoint){
    const d = haversine(lastPoint.lat, lastPoint.lon, point.lat, point.lon);
    const dt = Math.max(1, (point.time - lastPoint.time) / 1000);
    const kmh = (d / dt) * 3.6;

    if(d >= 1.5 && d <= 250 && kmh <= 180){
      distanceMeters += d;
      currentSpeed = kmh;
    }
  }

  lastPoint = point;
  updateUI();
}

function onGpsError(err){
  let msg = "Sin GPS";
  if(err.code === 1) msg = "GPS sin permiso";
  if(err.code === 2) msg = "GPS no disponible";
  if(err.code === 3) msg = "GPS lento";
  setGpsStatus(msg, "bad");
  console.log(err);
}

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = deg => deg * Math.PI / 180;
  const p1 = toRad(lat1);
  const p2 = toRad(lat2);
  const dp = toRad(lat2-lat1);
  const dl = toRad(lon2-lon1);
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function mapsUrl(kind){
  const dest = $("destination").value.trim();
  if(!dest){
    alert("Cargá una dirección destino primero.");
    return;
  }
  if(kind === "waze"){
    window.open("https://waze.com/ul?q=" + encodeURIComponent(dest) + "&navigate=yes", "_blank");
  } else {
    window.open("https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest) + "&travelmode=driving", "_blank");
  }
}

function saveTrip(trip){
  const list = getHistory();
  list.unshift(trip);
  localStorage.setItem("tripHistory", JSON.stringify(list.slice(0, 30)));
}

function getHistory(){
  try { return JSON.parse(localStorage.getItem("tripHistory") || "[]"); }
  catch(e){ return []; }
}

function renderHistory(){
  const box = $("history");
  const list = getHistory();
  if(!list.length){
    box.innerHTML = '<div class="empty">Sin viajes guardados todavía.</div>';
    return;
  }
  box.innerHTML = list.map(t => {
    const d = new Date(t.date);
    const date = d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    const dest = t.destination ? `<small>Destino: ${escapeHtml(t.destination)}</small>` : "";
    return `<div class="trip">
      <div>
        <strong>${money(t.total)}</strong>
        <small>${date}</small>
        ${dest}
      </div>
      <div style="text-align:right">
        <strong>${(t.meters/1000).toFixed(2)} km</strong>
        <small>${formatTime(t.seconds)}</small>
      </div>
    </div>`;
  }).join("");
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function clearHistory(){
  if(confirm("¿Borrar historial?")){
    localStorage.removeItem("tripHistory");
    renderHistory();
  }
}

function toast(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:white;padding:10px 14px;border-radius:999px;font-weight:800;z-index:9999";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
}

$("startBtn").onclick = startRide;
$("pauseBtn").onclick = pauseRide;
$("finishBtn").onclick = finishRide;
$("resetBtn").onclick = () => resetRide(true);
$("mapsBtn").onclick = () => mapsUrl("google");
$("wazeBtn").onclick = () => mapsUrl("waze");
$("saveFareBtn").onclick = saveFare;
$("clearHistoryBtn").onclick = clearHistory;

paintFare();
renderHistory();
updateUI();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(console.warn);
  });
}
</script>
</body>
</html>
